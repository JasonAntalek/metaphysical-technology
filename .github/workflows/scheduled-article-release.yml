name: Scheduled article release

on:
  schedule:
    # 11:30 UTC is 5:30 AM Mountain Daylight Time in August.
    # Daily coverage catches a missed release on the next available run.
    - cron: "30 11 14-27 8 *"
  workflow_dispatch:
    inputs:
      article_order:
        description: "Article to release, or auto for the earliest due article"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - "9"
          - "10"
          - "11"
          - "12"
          - "13"
          - "14"
          - "15"

permissions:
  contents: write

concurrency:
  group: scheduled-article-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'JasonAntalek/metaphysical-technology'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public record
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the approved article source
        run: git fetch origin agent/stage-first-principles-articles

      - name: Prepare the scheduled release
        env:
          ARTICLE_ORDER: ${{ inputs.article_order || 'auto' }}
        run: python3 scripts/release_scheduled_article.py --article-order "$ARTICLE_ORDER"

      - name: Publish changes
        run: |
          if git diff --quiet; then
            echo "No article is due."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles llms.txt llms-full.txt sitemap.xml scripts/build_llms_full.py
          git commit -m "Publish scheduled Metaphysical Technology article"
          git push origin HEAD:main
